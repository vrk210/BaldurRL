name: Repository contract

# Pull requests run on their own events; pushes run only for main.
on:
  push:
    branches: [main]
  pull_request:

# A newer push or PR event supersedes a running check of the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-quality.txt
      - run: python scripts/check_repository.py
      - run: python -m ruff check .
      - run: python -m pytest -q tests/test_repository_policy.py

  simulator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-harness-test.txt
            requirements-quality.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Verify behavior-preserving refactor
        if: "github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'Behavior: preserve')"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: powershell
        run: |
          python scripts/compare_refactor.py --base "$env:PR_BASE_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Fixed-seed semantic behavior changed" }
      - run: python -m pytest -q
